name: Build UltimateClient 1.21.11

on:
  push:
    paths:
      - "UltimateClient-1.21.11-source.zip"
      - ".github/workflows/build-1.21.11.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-1-21-11:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Extract source
        shell: bash
        run: |
          unzip -q UltimateClient-1.21.11-source.zip -d source
          test -d source/UltimateClient
          test -f source/UltimateClient/versions/1.21.11/src/main/java/dev/ultimate/McGame.java

      - name: Fix Entity position API for Minecraft 1.21.11
        shell: bash
        run: |
          FILE="source/UltimateClient/versions/1.21.11/src/main/java/dev/ultimate/McGame.java"
          # Entity uses getEntityPos() in 1.21.11; BlockEntity keeps getPos().
          sed -i 's/e\.getPos()/e.getEntityPos()/g' "$FILE"
          grep -Fq 'e.getEntityPos()' "$FILE"
          grep -Fq 'be.getPos()' "$FILE"

      - name: Build Minecraft 1.21.11
        shell: bash
        run: |
          cd source/UltimateClient
          set -o pipefail
          gradle ":versions:1.21.11:build" --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build-1.21.11.log"

      - name: Prepare mod JAR
        shell: bash
        run: |
          mkdir -p out
          JAR="$(find source/UltimateClient/versions/1.21.11/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" out/UltimateClient-1.21.11.jar
          test -s out/UltimateClient-1.21.11.jar

      - name: Upload actual mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: UltimateClient-1.21.11
          path: out/UltimateClient-1.21.11.jar
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-1.21.11
          path: build-1.21.11.log
          if-no-files-found: ignore
