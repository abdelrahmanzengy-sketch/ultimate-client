name: Build UltimateClient 1.21.11

on:
  push:
    paths:
      - "UltimateClient-source-v8.zip"
      - ".github/workflows/build-1.21.11.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-1-21-11:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Extract source
        shell: bash
        run: |
          unzip -q UltimateClient-source-v8.zip -d source
          test -d source/UltimateClient

      - name: Apply Minecraft 1.21.11 API compatibility fix
        shell: bash
        run: |
          FILE="source/UltimateClient/versions/1.21.11/src/main/java/dev/ultimate/McGame.java"
          # BlockEntity exposes getPos(); getEntityPos() does not exist in 1.21.11.
          # BlockEntity uses getPos(); Entity uses getEntityPos() in this target.
          sed -i 's/\.getEntityPos()/\.getPos()/g' "$FILE"
          sed -i 's/\\<e\.getPos()/e.getEntityPos()/g' "$FILE"
          grep -q 'e.getEntityPos()' "$FILE"

      - name: Build Minecraft 1.21.11
        shell: bash
        run: |
          cd source/UltimateClient
          set -o pipefail
          gradle ":versions:1.21.11:build" --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build-1.21.11.log"

      - name: Prepare mod JAR
        shell: bash
        run: |
          mkdir -p out
          JAR="$(find source/UltimateClient/versions/1.21.11/build/libs -maxdepth 1 -type f -name 'UltimateClient-1.21.11-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" out/UltimateClient-1.21.11.jar

      - name: Upload actual mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: UltimateClient-1.21.11
          path: out/UltimateClient-1.21.11.jar
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-1.21.11
          path: build-1.21.11.log
          if-no-files-found: ignore
